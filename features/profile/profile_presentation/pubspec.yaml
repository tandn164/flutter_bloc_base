name: profile_presentation
description: Profile Flutter UI and BLoC. Package-owned DI. No data-layer dependency.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.6.0
  flutter: ">=3.16.0"
resolution: workspace

dependencies:
  injectable: ^2.5.0
  get_it: ^8.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  profile_domain:
    path: ../profile_domain
  ui_kit:
    path: ../../../shared/ui_kit

dev_dependencies:
  build_runner: ^2.4.13
  injectable_generator: ^2.7.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  app_result:
    path: ../../../shared/app_result
