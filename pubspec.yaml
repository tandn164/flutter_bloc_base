name: flutter_ffca_base_workspace
description: Multi-app FFCA workspace root (not a Flutter app).
publish_to: "none"

environment:
  sdk: ^3.6.0

workspace:
  - apps/sample_app
  - shared/app_result
  - shared/connectivity
  - shared/tutorial_engine
  - shared/app_overlay
  - shared/local_storage/core
  - shared/local_storage/stores/shared_preferences
  - shared/local_storage/stores/drift
  - shared/memory_cache
  - shared/offline_sync
  - shared/api_client
  - shared/ui_kit
  - shared/session
  - shared/interceptor
  - shared/navigation
  - shared/logging
  - shared/push
  - features/sample/sample_domain
  - features/sample/sample_data
  - features/sample/sample_presentation
  - features/auth/auth_domain
  - features/auth/auth_data
  - features/auth/auth_presentation
  - features/profile/profile_domain
  - features/profile/profile_data
  - features/profile/profile_presentation
  - features/onboarding/onboarding_domain
  - features/onboarding/onboarding_data
  - features/onboarding/onboarding_presentation

  - features/service_catalog/service_catalog_domain
  - features/service_catalog/service_catalog_data
  - features/service_catalog/service_catalog_presentation
  - features/announcements/announcements_domain
  - features/announcements/announcements_data
  - features/announcements/announcements_presentation
  - features/work_orders/work_orders_domain
  - features/work_orders/work_orders_data
  - features/work_orders/work_orders_presentation
flutter:
  uses-material-design: true
