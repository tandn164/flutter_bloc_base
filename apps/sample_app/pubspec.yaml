name: sample_app
description: Sample app — Feature-First Clean Architecture + BLoC composition root.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  injectable: ^2.5.0
  chopper: ^8.1.0
  go_router: ^14.6.2
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  app_connectivity:
    path: ../../shared/connectivity
  app_overlay:
    path: ../../shared/app_overlay
  tutorial_engine:
    path: ../../shared/tutorial_engine
  local_storage:
    path: ../../shared/local_storage/core
  local_storage_drift:
    path: ../../shared/local_storage/stores/drift
  ui_kit:
    path: ../../shared/ui_kit
  app_navigation:
    path: ../../shared/navigation
  app_logging:
    path: ../../shared/logging
  service_catalog_domain:
    path: ../../features/service_catalog/service_catalog_domain
  service_catalog_data:
    path: ../../features/service_catalog/service_catalog_data
  service_catalog_presentation:
    path: ../../features/service_catalog/service_catalog_presentation
  announcements_domain:
    path: ../../features/announcements/announcements_domain
  announcements_data:
    path: ../../features/announcements/announcements_data
  announcements_presentation:
    path: ../../features/announcements/announcements_presentation
  work_orders_domain:
    path: ../../features/work_orders/work_orders_domain
  work_orders_data:
    path: ../../features/work_orders/work_orders_data
  work_orders_presentation:
    path: ../../features/work_orders/work_orders_presentation
  onboarding_domain:
    path: ../../features/onboarding/onboarding_domain
  onboarding_data:
    path: ../../features/onboarding/onboarding_data
  onboarding_presentation:
    path: ../../features/onboarding/onboarding_presentation
dev_dependencies:
  build_runner: ^2.4.13
  injectable_generator: ^2.7.0
  go_router_builder: 2.8.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  generate: true
